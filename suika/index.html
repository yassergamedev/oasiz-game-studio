<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Suika</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap");

      :root {
        --sky-bright: #bfe9ff;
        --sky-soft: #e3f5ff;
        --field: #c8f2b8;
        --field-deep: #9fd98f;
        --cream: #fffdf7;
        --ink: #3a4f6c;
        --ink-soft: #5a7194;
        --sun: #ffe566;
        --orange: #ff9f43;
        --orange-deep: #f5861f;
        --coral: #ff7b7b;
        --coral-soft: #ffb3a7;
        --accent: #ff9f43;
        --accent-dim: #f5861f;
        --text: #2f3d52;
        --muted: rgba(47, 61, 82, 0.72);
        --panel: rgba(255, 253, 247, 0.94);
        --stroke: rgba(58, 79, 108, 0.35);
        --panel-border: #3d5a80;
        /*
         * Top/side insets scale with viewport (vmin/vw) — not fixed px — plus safe-area.
         * Floors keep AGENTS: 45px desktop / 120px touch minimum top for interactive HUD.
         */
        --hud-pad-x: max(env(safe-area-inset-left, 0px), clamp(4px, 1.85vw, 2.4vmin));
        --hud-pad-x-end: max(env(safe-area-inset-right, 0px), clamp(4px, 1.85vw, 2.4vmin));
        --settings-top: max(
          env(safe-area-inset-top, 0px),
          clamp(45px, calc(5.5vmin + 1.2vh), 12vmin)
        );
      }

      @media (pointer: coarse) {
        :root {
          --hud-pad-x: max(env(safe-area-inset-left, 0px), clamp(6px, 2.2vw, 3vmin));
          --hud-pad-x-end: max(env(safe-area-inset-right, 0px), clamp(6px, 2.2vw, 3vmin));
          --settings-top: max(
            env(safe-area-inset-top, 0px),
            clamp(120px, calc(26vmin + 1vh), 38vmin)
          );
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, var(--sky-bright) 0%, var(--sky-soft) 42%, #dff6e8 78%, var(--field) 100%);
        font-family: "Fredoka", system-ui, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Slides in from the right over the main menu */
      #gameplayShell {
        position: fixed;
        inset: 0;
        z-index: 22;
        transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        pointer-events: none;
        will-change: transform;
      }

      #gameplayShell.gameplay-shell--in {
        transform: translateX(0);
        pointer-events: auto;
        will-change: auto;
      }

      #mergeJuiceRoot {
        position: absolute;
        inset: 0;
        z-index: 0;
        transform-origin: 50% 44%;
        pointer-events: none;
      }

      #mergeJuiceRoot #gameCanvas {
        pointer-events: auto;
      }

      #gameplayShell > #settingsBtn {
        pointer-events: auto;
      }

      #gameCanvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .hidden {
        display: none !important;
      }

      /* Start — toon / sports-day + menu motion */
      @keyframes startBlobDriftA {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        40% {
          transform: translate(14px, 20px) scale(1.06);
        }
        70% {
          transform: translate(-10px, 12px) scale(0.96);
        }
      }

      @keyframes startBlobDriftB {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        45% {
          transform: translate(-16px, -12px) scale(1.04);
        }
        75% {
          transform: translate(10px, -20px) scale(0.95);
        }
      }

      @keyframes startTitlePop {
        0% {
          opacity: 0;
          transform: scale(0.5) translateY(36px);
        }
        58% {
          opacity: 1;
          transform: scale(1.09) translateY(-6px);
        }
        78% {
          transform: scale(0.97) translateY(3px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes startTitleGradientFlow {
        0%,
        100% {
          background-position: 0% 50%;
          filter: drop-shadow(0 4px 0 rgba(58, 79, 108, 0.18)) drop-shadow(0 0 24px rgba(255, 159, 67, 0.35));
        }
        50% {
          background-position: 100% 50%;
          filter: drop-shadow(0 5px 0 rgba(58, 79, 108, 0.22)) drop-shadow(0 0 32px rgba(94, 200, 255, 0.45));
        }
      }

      @keyframes startBrandFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-0.75deg);
        }
        50% {
          transform: translateY(-11px) rotate(0.75deg);
        }
      }

      @keyframes startFadeUp {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes startBtnGlow {
        0%,
        100% {
          filter: brightness(1);
          box-shadow: 0 5px 0 #2d4a6e, 0 8px 20px rgba(245, 134, 31, 0.35);
        }
        50% {
          filter: brightness(1.07);
          box-shadow: 0 5px 0 #2d4a6e, 0 12px 32px rgba(245, 134, 31, 0.48);
        }
      }

      @keyframes startBgPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.92;
        }
      }

      /* Menu ball pit — constant-speed slide along one diagonal (alternate = smooth return, no zig-zag) */
      @keyframes menuBallDiagDrift {
        0% {
          transform: translate(-50%, -50%) translate(calc(-1 * var(--diag-x)), calc(-1 * var(--diag-y))) rotate(var(--rot));
        }
        100% {
          transform: translate(-50%, -50%) translate(var(--diag-x), var(--diag-y)) rotate(var(--rot));
        }
      }

      .start-balls-layer {
        position: absolute;
        inset: -12%;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .menu-silly-ball {
        --diag-x: 3vmin;
        --diag-y: 3vmin;
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        border: 3px solid rgba(45, 74, 110, 0.28);
        box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.07), 3px 4px 0 rgba(45, 74, 110, 0.14);
        animation: menuBallDiagDrift 5.4s linear infinite alternate;
        animation-delay: calc(var(--wave) * 0.09s);
        will-change: transform;
      }

      .menu-silly-ball--sprite {
        background: none;
        border: none;
        box-shadow: none;
        overflow: visible;
        mix-blend-mode: multiply;
      }

      .menu-silly-ball--sprite img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 1px 2px rgba(45, 74, 110, 0.1));
      }

      .menu-silly-ball.menu-silly-ball--rev {
        animation-duration: 6.6s;
        animation-direction: alternate-reverse;
        animation-delay: calc(var(--wave) * 0.09s + 0.5s);
      }

      .menu-silly-ball.menu-silly-ball--wobble {
        animation-duration: 4.5s;
        animation-delay: calc(var(--wave) * 0.09s + 0.22s);
      }

      #startScreen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        background: linear-gradient(
            180deg,
            rgba(191, 233, 255, 0.97) 0%,
            rgba(227, 245, 255, 0.96) 45%,
            rgba(200, 242, 184, 0.94) 100%
          ),
          radial-gradient(ellipse 90% 55% at 85% 8%, rgba(255, 229, 102, 0.45), transparent 55%);
        backdrop-filter: blur(8px);
        pointer-events: auto;
        animation: startBgPulse 5s ease-in-out infinite;
      }

      #startScreen::before,
      #startScreen::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        filter: blur(0.5px);
      }

      #startScreen::before {
        width: min(42vw, 200px);
        height: min(42vw, 200px);
        left: -5%;
        top: 14%;
        background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.5), rgba(255, 200, 220, 0.22) 55%, transparent 70%);
        animation: startBlobDriftA 11s ease-in-out infinite;
      }

      #startScreen::after {
        width: min(48vw, 220px);
        height: min(48vw, 220px);
        right: -8%;
        bottom: 18%;
        background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.38), rgba(180, 230, 255, 0.26) 50%, transparent 68%);
        animation: startBlobDriftB 13s ease-in-out -2s infinite;
      }

      .start-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 360px;
        width: 100%;
        background: transparent;
        border-radius: 0;
        padding: 20px 16px 28px;
        box-shadow: none;
      }

      .start-brand {
        animation: startBrandFloat 3.2s ease-in-out 0.8s infinite;
        margin-bottom: 6px;
      }

      .start-brand h1 {
        font-family: "Bungee", "Fredoka", system-ui, sans-serif;
        font-size: clamp(2.35rem, 9.5vw, 3.55rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0.04em;
        text-align: center;
        max-width: 18ch;
        margin: 0 auto;
        background: linear-gradient(
          110deg,
          #2a5080 0%,
          #3a4f6c 18%,
          var(--orange-deep) 38%,
          #ff9f43 52%,
          #4ec8ff 68%,
          #3a4f6c 85%,
          #2a5080 100%
        );
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        animation:
          startTitlePop 0.78s cubic-bezier(0.34, 1.35, 0.64, 1) forwards,
          startTitleGradientFlow 5.2s ease-in-out infinite 0.85s;
      }

      #noAssetWarning:not(.hidden) {
        animation: startFadeUp 0.45s ease-out forwards;
      }

      #btnStart {
        opacity: 0;
        animation: startFadeUp 0.52s ease-out 0.42s forwards, startBtnGlow 2.5s ease-in-out 1.15s infinite;
      }

      .start-bounds-wrap {
        margin-top: 18px;
        text-align: center;
        opacity: 0;
        animation: startFadeUp 0.52s ease-out 0.55s forwards;
      }

      .start-bounds-link {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-soft);
        text-decoration: none;
        border-bottom: 1px dashed rgba(58, 79, 108, 0.35);
        padding-bottom: 2px;
      }

      .start-bounds-link:active {
        color: var(--orange-deep);
      }

      @media (prefers-reduced-motion: reduce) {
        #startScreen,
        #startScreen::before,
        #startScreen::after,
        .start-brand,
        .start-brand h1,
        #btnStart,
        .start-bounds-wrap,
        #noAssetWarning:not(.hidden) {
          animation: none !important;
        }

        .menu-silly-ball {
          animation: none !important;
        }

        #startScreen .start-brand h1,
        #btnStart,
        .start-bounds-wrap {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
          color: var(--ink) !important;
          -webkit-text-fill-color: var(--ink) !important;
          background: none !important;
          filter: none !important;
        }

        .start-bounds-link {
          color: var(--ink-soft) !important;
          -webkit-text-fill-color: var(--ink-soft) !important;
        }

        #gameplayShell {
          transition: none !important;
        }
      }

      .btn-primary {
        appearance: none;
        border: 3px solid var(--panel-border);
        border-radius: 999px;
        padding: 14px 36px;
        font-family: inherit;
        font-size: 1.08rem;
        font-weight: 700;
        color: var(--cream);
        background: linear-gradient(180deg, var(--orange) 0%, var(--orange-deep) 100%);
        box-shadow: 0 5px 0 #2d4a6e, 0 8px 20px rgba(245, 134, 31, 0.35);
        cursor: pointer;
      }

      .btn-primary:active {
        transform: translateY(2px);
        box-shadow: 0 3px 0 #2d4a6e, 0 4px 12px rgba(245, 134, 31, 0.3);
      }

      /* HUD — hidden until play; pointer-events none on shell */
      #hud {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      /* Score = top-left corner; Next = true horizontal center; settingsBtn is sibling, top-right */
      #hudTop {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--settings-top);
        padding: 0 0 clamp(0.5rem, 2vmin, 1.25rem);
        min-height: clamp(44px, 13vmin, 72px);
        pointer-events: none;
      }

      @media (pointer: coarse) {
        #hudTop {
          padding: 0 0 clamp(0.2rem, 1.2vmin, 0.5rem);
          min-height: clamp(42px, 12vmin, 64px);
        }

        #hudTop .hud-card {
          padding: 5px 10px;
          border-radius: 14px;
          border-width: 2px;
        }

        #hudTop .hud-top-cell--left .hud-card {
          padding: clamp(0.2rem, 1vmin, 0.35rem) clamp(0.35rem, 1.6vw, 0.5rem);
          max-width: min(78px, 30vw);
          border-radius: 12px;
        }

        #hudTop .hud-label {
          font-size: 0.55rem;
          margin-bottom: 1px;
          letter-spacing: 0.06em;
        }

        #hudTop .hud-top-cell--left .hud-label {
          font-size: 0.48rem;
          margin-bottom: 0;
          letter-spacing: 0.05em;
        }

        #hudTop .hud-value {
          font-size: 1.2rem;
          line-height: 1.1;
        }

        #hudTop .hud-top-cell--left .hud-value {
          font-size: 0.98rem;
          line-height: 1;
        }
      }

      .hud-top-cell--left {
        position: absolute;
        top: 0;
        left: var(--hud-pad-x);
        justify-self: unset;
        justify-items: start;
        width: auto;
        min-width: 0;
        z-index: 2;
      }

      .hud-top-cell--left .hud-card {
        text-align: left;
        margin-inline: 0;
        margin-right: 0;
        max-width: min(104px, 28vw);
        padding: clamp(0.35rem, 1.2vmin, 0.5rem) clamp(0.5rem, 1.8vw, 0.65rem);
      }

      #hudTop .hud-top-cell--left .hud-label {
        font-size: clamp(0.52rem, 1.65vw, 0.58rem);
        margin-bottom: 2px;
        letter-spacing: 0.07em;
      }

      #hudTop .hud-top-cell--left .hud-value {
        font-size: clamp(1rem, 3.2vw, 1.12rem);
        line-height: 1.05;
      }

      .hud-top-cell--center {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        justify-self: unset;
        grid-column: unset;
        z-index: 1;
      }

      .hud-card {
        pointer-events: none;
        background: var(--panel);
        border: 3px solid var(--panel-border);
        border-radius: 18px;
        padding: 10px 16px;
        box-shadow: 0 4px 0 rgba(45, 74, 110, 0.2), 4px 4px 0 rgba(255, 255, 255, 0.85) inset;
      }

      .hud-label {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }

      .hud-value {
        font-size: 1.55rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      #nextBubble {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: clamp(64px, 20vmin, 104px);
        text-align: center;
      }

      .hud-evolution {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        padding: 6px 10px 22px;
        padding-bottom: max(22px, env(safe-area-inset-bottom, 0px) + 14px);
        background: linear-gradient(
          to top,
          rgba(255, 253, 247, 0.97) 0%,
          rgba(255, 253, 247, 0.78) 38%,
          rgba(255, 253, 247, 0.42) 72%,
          rgba(255, 253, 247, 0) 100%
        );
      }

      @media (pointer: coarse) {
        .hud-evolution {
          bottom: 16px;
          left: 6px;
          right: 6px;
          padding: 2px 2px max(6px, env(safe-area-inset-bottom, 0px) + 8px);
          background: linear-gradient(
            to top,
            rgba(255, 253, 247, 0.96) 0%,
            rgba(255, 253, 247, 0.62) 40%,
            rgba(255, 253, 247, 0.28) 78%,
            rgba(255, 253, 247, 0) 100%
          );
        }

        .hud-evolution-title {
          font-size: 0.5rem;
          margin-bottom: 3px;
          letter-spacing: 0.1em;
          color: var(--ink);
          text-shadow: 0 1px 0 rgba(255, 255, 255, 0.95), 0 0 12px rgba(255, 253, 247, 0.9);
        }

        .hud-evolution-scroll {
          padding: 7px 16px;
          margin: 0 auto;
          max-width: calc(100% - 4px);
          background: rgba(255, 253, 247, 0.88);
          border: 1px solid rgba(58, 79, 108, 0.22);
          border-radius: 999px;
          box-shadow: 0 4px 0 rgba(45, 74, 110, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior-x: contain;
          box-sizing: border-box;
          clip-path: inset(0 round 999px);
          -webkit-clip-path: inset(0 round 999px);
        }

        .hud-evolution-arrow {
          margin: 0 2px;
          border-top-width: 3px;
          border-bottom-width: 3px;
          border-left-width: 5px;
          border-left-color: rgba(58, 79, 108, 0.55);
        }

        .hud-evolution-node {
          border-width: 1px;
          box-shadow: 0 2px 0 rgba(45, 74, 110, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.85),
            0 0 0 1px rgba(255, 255, 255, 0.45);
          animation: hud-evo-node-bob-mobile 2.5s ease-in-out infinite;
        }

        #evolutionChain.hud-evolution-scroll--merge-pulse .hud-evolution-node {
          animation:
            hud-evo-node-bob-mobile 2.5s ease-in-out infinite,
            hud-evo-merge-glow 0.62s ease-out 1;
          animation-delay: var(--evo-delay, 0s), 0s;
        }
      }

      @keyframes hud-evo-node-bob-mobile {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-2px) scale(1.02);
        }
      }

      @media (pointer: fine) {
        .hud-evolution {
          padding-bottom: max(28px, env(safe-area-inset-bottom, 0px) + 20px);
        }
      }

      @keyframes hud-evo-node-bob {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-5px) scale(1.05);
        }
      }

      @keyframes hud-evo-arrow-shine {
        0%,
        100% {
          opacity: 0.45;
          filter: brightness(0.95);
        }
        50% {
          opacity: 1;
          filter: brightness(1.15);
        }
      }

      @keyframes hud-evo-title-twinkle {
        0%,
        100% {
          opacity: 0.82;
          letter-spacing: 0.11em;
        }
        50% {
          opacity: 1;
          letter-spacing: 0.14em;
        }
      }

      @keyframes hud-evo-merge-glow {
        0% {
          filter: brightness(1) drop-shadow(0 0 0 transparent);
        }
        35% {
          filter: brightness(1.22) drop-shadow(0 0 10px rgba(255, 186, 90, 0.55));
        }
        100% {
          filter: brightness(1) drop-shadow(0 0 0 transparent);
        }
      }

      .hud-evolution-title {
        display: block;
        text-align: center;
        font-size: 0.52rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 5px;
        animation: hud-evo-title-twinkle 3.2s ease-in-out infinite;
      }

      .hud-evolution-scroll {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 0;
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
        padding: 2px 0;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        pointer-events: auto;
      }

      .hud-evolution-scroll::-webkit-scrollbar {
        display: none;
      }

      .hud-evolution-arrow {
        flex-shrink: 0;
        width: 0;
        height: 0;
        margin: 0 3px;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 6px solid rgba(58, 79, 108, 0.42);
        animation: hud-evo-arrow-shine 2.6s ease-in-out infinite;
        animation-delay: var(--evo-arrow-delay, 0s);
      }

      .hud-evolution-node {
        flex-shrink: 0;
        border-radius: 50%;
        border: 1px solid var(--panel-border);
        background: var(--cream);
        box-shadow: 0 1px 0 rgba(45, 74, 110, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.75);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: hud-evo-node-bob 2.5s ease-in-out infinite;
        animation-delay: var(--evo-delay, 0s);
      }

      #evolutionChain.hud-evolution-scroll--merge-pulse .hud-evolution-node {
        animation:
          hud-evo-node-bob 2.5s ease-in-out infinite,
          hud-evo-merge-glow 0.62s ease-out 1;
        animation-delay: var(--evo-delay, 0s), 0s;
      }

      @keyframes gameplayHudPopIn {
        from {
          opacity: 0;
          transform: scale(0.78);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      #hud.hud--intro-pop #hudTop {
        animation: gameplayHudPopIn 0.52s cubic-bezier(0.28, 1.28, 0.32, 1) both;
        transform-origin: top left;
      }

      #hud.hud--intro-pop .hud-evolution {
        animation: gameplayHudPopIn 0.55s cubic-bezier(0.28, 1.28, 0.32, 1) 0.1s both;
        transform-origin: bottom center;
      }

      #settingsBtn.hud--intro-pop {
        animation: gameplayHudPopIn 0.46s cubic-bezier(0.28, 1.28, 0.32, 1) 0.05s both;
        transform-origin: top right;
      }

      .hud-evolution-node img {
        width: 78%;
        height: 78%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .hud-evolution-title,
        .hud-evolution-arrow,
        .hud-evolution-node {
          animation: none !important;
        }

        #evolutionChain.hud-evolution-scroll--merge-pulse .hud-evolution-node {
          animation: none !important;
        }

        #hud.hud--intro-pop #hudTop,
        #hud.hud--intro-pop .hud-evolution,
        #settingsBtn.hud--intro-pop {
          animation: none !important;
          opacity: 1;
          transform: none;
        }

        #nextOrb.next-orb--enter {
          animation: none !important;
          transform: none;
          opacity: 1;
        }

        #settingsModal.settings-modal-root .settings-panel,
        #settingsModal.settings-modal-root {
          transition: none !important;
        }

        #settingsModal.settings-modal-root--closed .settings-panel,
        #settingsModal.settings-modal-root--open .settings-panel {
          transform: none;
        }

        #settingsModal.settings-modal-root--open .settings-panel {
          opacity: 1;
        }

        #settingsModal.settings-modal-root--closed .settings-panel {
          opacity: 0;
        }
      }

      #nextOrb {
        width: clamp(32px, 10vmin, 56px);
        height: clamp(32px, 10vmin, 56px);
        border-radius: 50%;
        margin-top: clamp(2px, 0.9vmin, 10px);
        background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.85), transparent 42%), var(--cream);
        border: none;
        box-shadow: 0 5px 16px rgba(45, 74, 110, 0.12), inset 0 -2px 10px rgba(200, 230, 255, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.75);
        transform-origin: center center;
      }

      @media (pointer: coarse) {
        #nextOrb {
          box-shadow: 0 4px 14px rgba(45, 74, 110, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }
      }

      @keyframes nextOrbSwapIn {
        0% {
          opacity: 0.35;
          transform: scale(0.3) rotate(-14deg);
        }
        55% {
          opacity: 1;
          transform: scale(1.1) rotate(4deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      #nextOrb.next-orb--enter {
        animation: nextOrbSwapIn 0.48s cubic-bezier(0.28, 1.25, 0.32, 1) both;
      }

      /* Settings — top-right; size scales with vmin like the rest of the HUD */
      #settingsBtn {
        position: absolute;
        top: var(--settings-top);
        right: var(--hud-pad-x-end);
        z-index: 30;
        width: clamp(44px, 11.5vmin, 56px);
        height: clamp(44px, 11.5vmin, 56px);
        border-radius: clamp(12px, 3vmin, 16px);
        border: clamp(2px, 0.55vmin, 3px) solid var(--panel-border);
        background: var(--cream);
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        box-shadow: 0 4px 0 rgba(45, 74, 110, 0.18);
      }

      #settingsBtn svg {
        width: clamp(20px, 5.2vmin, 26px);
        height: clamp(20px, 5.2vmin, 26px);
      }

      @media (pointer: coarse) {
        #settingsBtn {
          top: var(--settings-top);
          right: var(--hud-pad-x-end);
          width: clamp(40px, 10.5vmin, 52px);
          height: clamp(40px, 10.5vmin, 52px);
          border-radius: clamp(10px, 2.8vmin, 14px);
          border-width: clamp(2px, 0.5vmin, 3px);
          box-shadow: 0 3px 0 rgba(45, 74, 110, 0.16);
        }

        #settingsBtn svg {
          width: clamp(18px, 4.8vmin, 24px);
          height: clamp(18px, 4.8vmin, 24px);
        }
      }

      #settingsBtn:active {
        transform: scale(0.96);
      }

      /* Settings modal — open/close with scale (avoid .hidden so transitions run) */
      #settingsModal.settings-modal-root {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        backdrop-filter: blur(0);
        transition:
          opacity 0.24s ease,
          backdrop-filter 0.32s ease,
          background-color 0.24s ease;
      }

      #settingsModal.settings-modal-root--closed {
        opacity: 0;
        pointer-events: none;
        background-color: rgba(58, 79, 108, 0);
      }

      #settingsModal.settings-modal-root--open {
        opacity: 1;
        pointer-events: auto;
        background-color: rgba(58, 79, 108, 0.35);
        backdrop-filter: blur(6px);
      }

      .settings-panel {
        width: min(360px, 100%);
        background: var(--cream);
        border: 4px solid var(--panel-border);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 8px 0 rgba(45, 74, 110, 0.2), 0 20px 50px rgba(58, 79, 108, 0.2);
        transform-origin: center center;
        transform: scale(0.9);
        opacity: 0;
        transition:
          transform 0.34s cubic-bezier(0.28, 1.22, 0.36, 1),
          opacity 0.26s ease;
      }

      #settingsModal.settings-modal-root--open .settings-panel {
        transform: scale(1);
        opacity: 1;
      }

      .settings-panel h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 2px dashed rgba(58, 79, 108, 0.15);
      }

      .settings-row:last-of-type {
        border-bottom: none;
      }

      .settings-row span {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .toggle {
        width: 52px;
        height: 30px;
        border-radius: 999px;
        border: 2px solid var(--panel-border);
        background: rgba(200, 220, 235, 0.6);
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.2s ease;
      }

      .toggle.on {
        background: linear-gradient(90deg, var(--field-deep), #7dd87a);
      }

      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s ease;
      }

      .toggle.on::after {
        transform: translateX(22px);
      }

      .settings-footer {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
      }

      .btn-ghost {
        appearance: none;
        border: 3px solid var(--panel-border);
        background: var(--sky-soft);
        color: var(--ink);
        font-family: inherit;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 3px 0 rgba(45, 74, 110, 0.12);
      }

      #noAssetWarning {
        color: #d94a4a;
        font-size: 0.85rem;
        font-weight: 600;
        max-width: 280px;
        margin-top: -8px;
        margin-bottom: 12px;
      }

      #gameOver {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(6, 8, 18, 0.88);
        backdrop-filter: blur(12px);
        pointer-events: auto;
      }

      #gameOver .go-inner {
        text-align: center;
        max-width: 320px;
        padding: 28px 24px;
        background: var(--cream);
        border: 4px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 8px 0 rgba(45, 74, 110, 0.12);
        opacity: 0;
        transform: scale(0.84);
        transition:
          opacity 0.4s ease,
          transform 0.52s cubic-bezier(0.28, 1.35, 0.32, 1);
      }

      #gameOver.game-over--reveal .go-inner {
        opacity: 1;
        transform: scale(1);
      }

      #gameOver h2 {
        font-size: 1.85rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--ink);
      }

      #gameOver .go-score {
        font-size: 1.3rem;
        color: var(--orange-deep);
        margin-bottom: 24px;
        font-weight: 700;
      }

    </style>
  </head>
  <body>
    <div id="startScreen">
      <div class="start-balls-layer" aria-hidden="true"></div>
      <div class="start-inner">
        <div class="start-brand">
          <h1>Ball Merge</h1>
        </div>
        <p id="noAssetWarning" class="hidden">
          Add ball images (.png / .webp) to the suika/assets/balls folder, then run the build again.
        </p>
        <button type="button" class="btn-primary" id="btnStart">Play</button>
        <!--
        <p class="start-bounds-wrap">
          <a class="start-bounds-link" href="?bounds" id="boundsEditorLink">Tune ball colliders</a>
        </p>
        -->
      </div>
    </div>

    <div id="gameplayShell">
      <div id="mergeJuiceRoot">
        <canvas id="gameCanvas" aria-label="Game" tabindex="0"></canvas>
      </div>

      <div id="hud" class="hidden">
        <div id="hudTop">
          <div class="hud-top-cell hud-top-cell--left">
            <div class="hud-card">
              <div class="hud-label">Score</div>
              <div class="hud-value" id="scoreValue">0</div>
            </div>
          </div>
          <div class="hud-top-cell hud-top-cell--center">
            <div class="hud-card" id="nextBubble">
              <div class="hud-label">Next</div>
              <div id="nextOrb" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="hud-evolution" id="hudEvolution" aria-hidden="true">
          <span class="hud-evolution-title">Merge chain</span>
          <div class="hud-evolution-scroll" id="evolutionChain"></div>
        </div>
      </div>

      <button type="button" id="settingsBtn" class="hidden" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"
          />
        </svg>
      </button>
    </div>

    <div id="gameOver" class="hidden">
      <div class="go-inner">
        <h2>Game over</h2>
        <p class="go-score">Score <span id="finalScore">0</span></p>
        <button type="button" class="btn-primary" id="btnRestart">Play again</button>
      </div>
    </div>

    <div
      id="settingsModal"
      class="settings-modal-root settings-modal-root--closed"
      aria-hidden="true"
    >
      <div class="settings-panel" role="dialog" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">Settings</h2>
        <div class="settings-row">
          <span>Music</span>
          <button type="button" class="toggle on" id="toggleMusic" aria-pressed="true"></button>
        </div>
        <div class="settings-row">
          <span>Sound effects</span>
          <button type="button" class="toggle on" id="toggleFx" aria-pressed="true"></button>
        </div>
        <div class="settings-row">
          <span>Haptics</span>
          <button type="button" class="toggle on" id="toggleHaptics" aria-pressed="true"></button>
        </div>
        <div class="settings-footer">
          <button type="button" class="btn-ghost" id="btnCloseSettings">Done</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
